# Tau-Bench Retail PRISM main experiment configuration
# Paper: "Beyond Prompts: Measuring and Optimizing LLM Tool-Agent Harnesses"
# Requires: pip install "agent-harness-optimizer[tau]"  AND tau2-bench installed
#
# Run with:
#   python -m agent_harness_optimizer.cli --benchmark tau-retail --optimizer prism \
#     --inner-model <inner_model> --outer-model <outer_model> \
#     --output-dir runs/tau-retail-prism-s0 \
#     --split-seed 0 \
#     --train-cases 20 --holdout-cases 20 \
#     --generations 10 --mutations-per-gen 3 \
#     --wall-time-s 600 --max-steps 200 \
#     --scorecard-trials 4

benchmark: tau-retail
optimizer: prism

inner_model: "openai/gpt-5.4-mini"
outer_model: "anthropic/claude-opus-4-7"

# Tau-bench requires longer budgets — the tau2 orchestrator counts every
# message exchange (including tool calls) as one step.
wall_time_s: 600
max_steps: 200
max_tokens: 100000

generations: 10
mutations_per_gen: 3
# Tau retail: 114-task curated base pool, split into train/holdout/scorecard
train_cases: 20
holdout_cases: 20
seed: 42

split_seed: 0  # tau stratified split seed

# pass^k evaluation: paper used k=4 for tau benchmarks
scorecard_trials: 4

outer_max_turns: 300
acceptance: holdout_pass_rate

repeat_id: 0
search_seed: 0

# Notes:
# - tau2-bench data dir is configured via TAU2_DATA_DIR env var, or --tau-data-dir
# - Paper used the "base" task pool (114 curated tasks) with stratified sampling
# - Retail domain splits by task category: exchange/return/other
# - pass^k (k=4) is the primary eval metric for tau benchmarks
# - Scorecard split: 114 base tasks − 20 train − 20 holdout = 74 scorecard cases
#   (compare: BFCL uses 600 out-of-sample scorecard cases from a larger pool)
# - search_seed / repeat_id are LABELS only — they do not set LLM sampling seeds.
#   Multiple repeats with the same config will produce statistically similar but
#   not identical outputs. Reproducibility means same protocol, not same outputs.
